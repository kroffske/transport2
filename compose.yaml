services:
  ml:
    build: .
    command: ["uvicorn", "transport_ml.service:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      MODEL_DIR: /models
    volumes:
      - ${MODEL_DIR:-./models/final}:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6

  backend:
    build: .
    command: ["uvicorn", "transport_backend.service:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      DATA_DIR: /data
      MODEL_URL: http://ml:8000
      # One run per process: waits for the demo driver's POST /v1/run (see profile "demo").
      SOURCE_CLOCK: ${SOURCE_CLOCK:-simulation}
      NDTP_HOST: 0.0.0.0
      NDTP_PORT: "9201"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    ports:
      - "8001:8001"
      - "9201:9201"
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6

  consumer:
    build:
      context: .
      args:
        # Build identity shown in diagnostics; unset -> "unknown", never a guessed hash.
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    command: ["uvicorn", "consumer.service:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    environment:
      BACKEND_URL: http://backend:8001
    ports:
      - "8002:8002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6

  # Official NDTP emulator, loaded beforehand with
  # `docker load -i data/emulator/ndtp-telemetry-emulator.tar`; never pulled.
  # Port 18080 is published on loopback for diagnostics only.
  emulator:
    profiles: ["demo"]
    image: ${EMULATOR_IMAGE:-ndtp-telemetry-emulator:1.0}
    pull_policy: never
    platform: linux/amd64
    ports:
      - "127.0.0.1:18080:18080"
    depends_on:
      backend:
        condition: service_healthy

  # Registers the run in the Backend, then feeds the emulator with project GPS points
  # through its own POST /api/config; exits when the dataset window is over.
  driver:
    profiles: ["demo"]
    build: .
    command: ["python", "-m", "scripts.emulator_driver"]
    environment:
      DATA_DIR: /data
      EMULATOR_URL: http://emulator:18080
      BACKEND_URL: http://backend:8001
      NDTP_TARGET_HOST: backend
      NDTP_TARGET_PORT: "9201"
      DEMO_SPEEDUP: ${DEMO_SPEEDUP:-5}
      DEMO_POST_PERIOD_S: ${DEMO_POST_PERIOD_S:-2}
      DEMO_WINDOW: ${DEMO_WINDOW:-00:00-23:59}
      DEMO_REPEAT_MAX_S: ${DEMO_REPEAT_MAX_S:-30}
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
      consumer:
        condition: service_healthy
      emulator:
        condition: service_started
