# [tasks.workflow.overrides]
# allow = ["mode", "provider", "local_at", "external_at", "offline", "no_task"]
# record = true
#
# [tasks.providers.linear]
# workspace = "engineering"
# team = "ALG"
# project = "Backlog"
# write_enabled = false
# task-workflow-example:external-first:end

# task-workflow-example:paired:begin
