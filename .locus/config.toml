#
# [tasks.workflow.title]
# seed = "creation-source"
# post_create = "independent"
# directory_rename = "never"
# drift = "show"
#
# [tasks.workflow.sync]
# intake = "seed-once"
# team = "observe"
# execution = "manual"
# details = "local-only"
# comments = "manual"
