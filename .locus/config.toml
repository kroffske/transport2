[reference_policy]
doc = "docs/reference-policy.md"
normal_skill_max_refs = 3
orchestrator_max_refs = 5
setup_max_refs = 0
allow_many_refs = ["code-standard"]

[skill_budgets.router]
body_lines = 80
references = 2

[skill_budgets.workflow]
body_lines = 120
references = 3

[skill_budgets.orchestrator]
body_lines = 150
references = 5

[skill_budgets.standard]
body_lines = 80
references = -1
requires_index = true

[export]
output_dir = "~/zips"
include_ignored_paths = [".tasks", ".ml-kaggle", ".locus"]
max_file_mb = 10

[plan_review]
default_profile = "standard"
max_rounds = 2
stale_on_binding_change = true

[pm]
prompt_file = "process.md"
default_delivery_mode = "standard"
default_orchestration_mode = "inline"
allow_automatic_escalation = true
require_reason_for_deescalation = true

[plan]
prompt_file = "process.md"

[pm.delivery_modes.accelerated]
plan_review_profile = "light"
plan_review_gate = "advisory"
require_completion_report = false

[pm.delivery_modes.standard]
plan_review_profile = "standard"
plan_review_gate = "required"
require_completion_report = true

[pm.delivery_modes.full]
plan_review_profile = "deep"
plan_review_gate = "required"
require_traceability = true
require_completion_report = true

[ship]
# Replace this starter with the repository's exact direct-main or PR-only flow,
# verification, release, deploy, and evidence rules. Keep the complete policy
# in prose instead of decomposing it into target flags.
# Public example: never push directly to main; push a task branch and create or
# update a pull request, then stop before merge unless explicitly authorized.
# Trusted example: accepted and verified work may commit and push directly to
# main, followed by the repository's exact install or deploy procedure.
prompt = '''
Before shipping, follow the accepted task or user request and the repository's root AGENTS.md when present.
Treat commit, push, pull request, merge, release, and deploy as distinct boundaries; stop at the last boundary the request and repository flow authorize.
If the repository has not stated whether its base branch may be updated directly or only through a pull request, stop before remote mutation and resolve that rule first.
Record the branch, commit, checks, and any remote URL or deploy result that were actually reached.
'''
