schema = "locus.config.v1"

# User-wide prose defaults belong in ~/.locus/config.toml. Add [user].language
# here only for a project-specific reply-language override. Use [preamble].prompt
# for artifact-language rules, including exceptions to user-wide prompts.
# User and project prompt fragments are both emitted, in that order.
# locus docs init uses [user].language unless --language is supplied.

[git]
base_branch = "main"
main_worktree = ""
task_root_policy = "auto"
report_root_policy = "auto"

[locus]
memory_root = ".locus"
roadmap = ".locus/roadmap.md"
contract_path = ".locus/AGENTS.md"
registry_rule = "Register major .locus/** surfaces and owner changes in .locus/AGENTS.md; do not enumerate files."

[locus.tasks]
root = ".tasks"

[locus.reports]
root = ".reports"

[locus.docs]
root = "docs"

# Authoritative docs-owned roots for each document type. A non-empty value wins
# over the docs/<key> default. Project configuration is the owner.
# default: docs/* for the docs-owned types.
[locus.docs.roots]
prd = "docs/prd"
adr = "docs/adr"
system_design = "docs/system-design"
runbook = "docs/runbooks"

[locus.specs]
# spec root per ADR-001 (decision-doc storage standard)
root = "docs/specs"

# This package only loads and validates task workflow policy for future WF-3/WF-6
# consumers. Current task commands do not route, materialize, or cause provider
# side effects from these settings. Policy is project-only and opt-in: uncomment
# exactly one body below and keep the active schema declaration above.
# `write_enabled` is project intent, never host authorization; do not
# place tokens, passwords, API keys, credentials, or other secrets here.

# task-workflow-example:local:begin
# [tasks.workflow]
# default_mode = "local"
# allow_no_task = false
# no_task_max_risk = "low"
#
# [tasks.workflow.materialization]
# local = "intake"
# external = "manual"
#
# [tasks.workflow.title]
# seed = "creation-source"
# post_create = "independent"
# directory_rename = "never"
# drift = "show"
#
# [tasks.workflow.sync]
# intake = "off"
# team = "off"
# execution = "off"
# details = "local-only"
# comments = "off"
#
# [tasks.workflow.failure]
# provider_unavailable = "fail"
# ambiguous_write = "readback"
# weak_identity_write = "deny"
# closure_with_pending = "block"
#
# [tasks.workflow.overrides]
# allow = ["mode", "provider", "local_at", "external_at", "offline", "no_task"]
# record = true
# task-workflow-example:local:end

# task-workflow-example:external-first:begin
# [tasks.workflow]
# default_mode = "external-first"
# provider = "linear"
# allow_no_task = true
# no_task_max_risk = "low"
#
# [tasks.workflow.materialization]
# local = "planning"
# external = "intake"
#
# [tasks.workflow.title]
# seed = "creation-source"
# post_create = "independent"
# directory_rename = "never"
# drift = "show"
#
# [tasks.workflow.sync]
# intake = "seed-once"
# team = "observe"
# execution = "publish"
# details = "local-only"
# comments = "semantic-only"
#
# [tasks.workflow.failure]
# provider_unavailable = "queue"
# ambiguous_write = "readback"
# weak_identity_write = "deny"
# closure_with_pending = "allow-visible"
